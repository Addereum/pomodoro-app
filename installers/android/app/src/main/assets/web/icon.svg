<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="tomatoGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="55%" stop-color="#e03131"/>
      <stop offset="100%" stop-color="#c92a2a"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51cf66"/>
      <stop offset="100%" stop-color="#2b8a3e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Tomato Body -->
  <circle cx="64" cy="68" r="48" fill="url(#tomatoGrad)" filter="url(#shadow)"/>

  <!-- Dial Ring Accent -->
  <circle cx="64" cy="68" r="38" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2.5" stroke-dasharray="4 6"/>

  <!-- Dial Ticks (Top 25 min indicator) -->
  <line x1="64" y1="33" x2="64" y2="40" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="99" y1="68" x2="92" y2="68" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="103" x2="64" y2="96" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="29" y1="68" x2="36" y2="68" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Clock Hand Pointing to 25 -->
  <line x1="64" y1="68" x2="64" y2="46" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="64" cy="68" r="4.5" fill="#ffffff"/>

  <!-- Stem & Leaves -->
  <path d="M 64 26 C 64 16, 70 14, 74 12 C 73 17, 70 21, 66 24 Z" fill="#2f9e44"/>
  <path d="M 64 25 C 56 18, 44 22, 42 27 C 50 27, 58 26, 64 25 Z" fill="url(#leafGrad)"/>
  <path d="M 64 25 C 72 18, 84 22, 86 27 C 78 27, 70 26, 64 25 Z" fill="url(#leafGrad)"/>
  <path d="M 64 26 C 60 32, 52 35, 48 37 C 54 34, 60 31, 64 26 Z" fill="url(#leafGrad)"/>
  <path d="M 64 26 C 68 32, 76 35, 80 37 C 74 34, 68 31, 64 26 Z" fill="url(#leafGrad)"/>
  <circle cx="64" cy="26" r="3.5" fill="#2b8a3e"/>
</svg>
