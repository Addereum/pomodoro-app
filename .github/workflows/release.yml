name: Release Addereums Pomodoro

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Linux Packages (DEB, RPM, AppImage, Tarball)
    runs-on: ubuntu-latest
    # 🔒 SICHERHEIT: Nur du ("addereum") darfst diesen Workflow ausführen!
    if: github.actor == 'addereum'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Version festlegen
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=${VER}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Systemabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zip imagemagick wget file

      - name: AppImageTool einrichten
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          (cd /tmp && ./appimagetool --appimage-extract)
          sudo mv /tmp/squashfs-root/AppRun /usr/local/bin/appimagetool
          sudo cp -r /tmp/squashfs-root/usr/* /usr/local/

      - name: Alle Linux & Windows-Basis Pakete bauen
        run: |
          chmod +x installers/*.sh installers/windows/*.py installers/macos/*.sh
          ./installers/build-all.sh

      - name: Linux Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            installers/dist/*.deb
            installers/dist/*.rpm
            installers/dist/*.tar.gz
            installers/dist/*.zip
            installers/dist/*.AppImage
          if-no-files-found: warn

  build-windows-installer:
    name: Build Standalone Windows Setup (.exe)
    runs-on: windows-latest
    if: github.actor == 'addereum'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Windows Launcher Executable generieren
        shell: bash
        run: |
          mkdir -p installers/dist/windows
          python3 installers/windows/pomodoro-pe-builder.py installers/dist/windows/Pomodoro.exe 'powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "bin\launcher.ps1"'

      - name: Inno Setup Single-File Installer kompilieren
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content installers/windows/pomodoro-setup.iss) -replace 'MyAppVersion ".*"', "MyAppVersion `"$ver`"" | Set-Content installers/windows/pomodoro-setup.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installers/windows/pomodoro-setup.iss
          Get-ChildItem installers/dist/*.exe

      - name: Windows Setup (.exe) hochladen
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-exe
          path: installers/dist/*.exe
          if-no-files-found: error

  build-macos-app:
    name: Build macOS DMG & App Bundle (.zip)
    runs-on: macos-latest
    if: github.actor == 'addereum'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Version festlegen
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=${VER}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: macOS App Bundle & DMG erstellen
        run: |
          chmod +x installers/macos/*.sh installers/macos/*.py
          ./installers/macos/build-macos.sh

      - name: macOS Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            installers/dist/*macOS*.zip
            installers/dist/*macOS*.dmg
          if-no-files-found: warn

  build-android-apk:
    name: Build Android APK (Tablet & Smartphone)
    runs-on: ubuntu-latest
    if: github.actor == 'addereum'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Version festlegen
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=${VER}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android SDK Lizenzen akzeptieren
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Web-Assets synchronisieren
        run: |
          chmod +x installers/android/*.sh
          ./installers/android/prepare-assets.sh

      - name: Release Keystore vorbereiten (falls Secret gesetzt)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: APK mit Gradle kompilieren
        working-directory: installers/android
        run: |
          gradle assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: APK für Release vorbereiten
        run: |
          mkdir -p installers/dist
          FOUND_APK=$(find installers/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" "installers/dist/Addereums-Pomodoro-${APP_VERSION}.apk"
          fi

      - name: Android APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: installers/dist/Addereums-Pomodoro-*.apk
          if-no-files-found: warn

  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-packages, build-windows-installer, build-macos-app, build-android-apk]
    runs-on: ubuntu-latest
    if: github.actor == 'addereum'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Alle gebauten Artefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Prüfsummen (SHA256) für alle Release-Dateien generieren
        run: |
          cd release-files
          sha256sum *.{deb,rpm,tar.gz,zip,exe,dmg,AppImage,apk} > SHA256SUMS 2>/dev/null || true
          ls -lh

      - name: GitHub Release erstellen & alle Plattform-Pakete anhängen
        uses: softprops/action-gh-release@v2
        with:
          name: "Addereums Pomodoro ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
